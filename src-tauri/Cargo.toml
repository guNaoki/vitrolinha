[package]
name = "vitrolinha"
version = "0.1.0"
description = "Vitrolinha — flyout de música com cara de toca-discos vintage"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: o front lê a capa (arquivo temporário) via asset://
# tray-icon: bandeja do sistema
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-store = "2" # persistência das configurações (previsto no briefing)
tauri-plugin-single-instance = "2" # uma instância só (previsto no briefing)
tauri-plugin-autostart = "2" # iniciar com o Windows (previsto no briefing)
tauri-plugin-global-shortcut = "2" # atalhos globais (extra pedido pelo usuário)
sha2 = "0.10" # PKCE do Discord (desafio S256)
getrandom = "0.3" # PKCE do Discord (verificador aleatório)
base64 = "0.21" # PKCE do Discord (base64 URL-safe)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  "Web_Http", # HttpClient do sistema para buscar letras (sem crate HTTP extra)
  "Web_Http_Headers",
  "Win32_Media_Audio", # volume do sistema (controle de volume do painel)
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_WinRT",
  "Win32_UI_Shell", # SHQueryUserNotificationState (suprimir o popup em tela cheia)
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
