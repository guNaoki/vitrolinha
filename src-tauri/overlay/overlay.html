<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vitrolinha — overlay</title>
<style>
@font-face { font-family: "IM Fell English"; src: url("/fonts/im-fell-english-latin-400-normal.woff2") format("woff2"); font-style: normal; }
@font-face { font-family: "IM Fell English"; src: url("/fonts/im-fell-english-latin-400-italic.woff2") format("woff2"); font-style: italic; }
@font-face { font-family: "Krona One"; src: url("/fonts/krona-one-latin-400-normal.woff2") format("woff2"); }
:root { --amber: #e8a33d; --cream: #efe2c3; --dim: #b8a888; --bg: #0d0a07; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { font-family: "IM Fell English", Georgia, serif; color: var(--cream); }
/* Cartão de 520×170 (tamanho sugerido da fonte de navegador no OBS); some sozinho sem música. */
.card {
  position: absolute; left: 10px; top: 10px; width: 500px; height: 150px;
  display: flex; align-items: center; gap: 22px; padding: 0 26px 0 18px; box-sizing: border-box;
  border-radius: 16px; border: 1px solid rgba(239, 226, 195, 0.18);
  background: radial-gradient(ellipse at 20% 30%, #2a1c0d 0%, var(--bg) 75%);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  opacity: 0; transform: translateY(8px); transition: opacity 0.6s ease, transform 0.6s ease;
}
body[data-on] .card { opacity: 1; transform: none; }
.disc {
  flex: none; position: relative; width: 112px; height: 112px; border-radius: 50%;
  background: repeating-radial-gradient(circle, #0d0b08 0 2px, #1c1711 2px 4px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(239, 226, 195, 0.1);
  animation: spin 1.8s linear infinite; animation-play-state: paused;
}
body[data-playing] .disc { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.label {
  position: absolute; inset: 31%; border-radius: 50%;
  background: var(--amber) center / cover no-repeat; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.3);
}
.label::after { content: ""; position: absolute; inset: 42%; border-radius: 50%; background: var(--bg); }
.text { min-width: 0; flex: 1; }
.eyebrow { font: 10px/1.2 "Krona One", "Segoe UI", sans-serif; letter-spacing: 0.24em; color: var(--amber); text-transform: uppercase; }
h1 { margin: 6px 0 0; font-size: 30px; font-weight: 400; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { margin: 6px 0 0; font-size: 19px; font-style: italic; color: #d8cba9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { margin-top: 12px; height: 3px; border-radius: 2px; background: rgba(239, 226, 195, 0.22); }
.bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--amber); }
@media (prefers-reduced-motion: reduce) { .disc { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="disc"><div class="label" id="label"></div></div>
  <div class="text">
    <div class="eyebrow" id="eyebrow">Tocando agora</div>
    <h1 id="title"></h1>
    <div class="artist" id="artist"></div>
    <div class="bar"><i id="fill"></i></div>
  </div>
</div>
<script>
// Pergunta ao Vitrolinha o que toca a cada 1 s (só no próprio computador) e interpola entre as respostas.
let s = null, cover = "";
const $ = (id) => document.getElementById(id);
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    if (r.ok) { s = await r.json(); s.at = performance.now(); }
  } catch { s = null; }
  render();
}
function render() {
  const on = s && s.title && s.status !== "stopped";
  document.body.toggleAttribute("data-on", !!on);
  document.body.toggleAttribute("data-playing", !!on && s.status === "playing");
  if (!on) return;
  $("title").textContent = s.title;
  $("artist").textContent = s.artist;
  $("eyebrow").textContent = s.status === "playing" ? "Tocando agora" : "Pausado";
  document.documentElement.style.setProperty("--amber", s.accentColor || "#e8a33d");
  if (s.coverKey !== cover) {
    cover = s.coverKey;
    $("label").style.backgroundImage = s.hasCover ? `url("/cover?k=${encodeURIComponent(cover)}")` : "";
  }
  tick();
}
function tick() {
  if (!s || !s.durationMs) { $("fill").style.width = "0"; return; }
  const live = s.status === "playing" ? (Date.now() - s.sampledAtMs) : 0;
  const pos = Math.min(s.durationMs, s.positionMs + Math.max(0, live));
  $("fill").style.width = (pos / s.durationMs * 100).toFixed(2) + "%";
}
poll(); setInterval(poll, 1000); setInterval(tick, 250);
</script>
</body>
</html>
